<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0922">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Poussière d'Étoiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Layout: a phone app in a magical night sky. One glowing pouch fills with stardust at the top; task charms below; a bottom bar switches to the Constellation of finished pouches. */
:root{
  --night:#0c0922;
  --deep:#161238;
  --panel:#1d1749;
  --line:#3a3184;
  --text:#f5f1ff;
  --soft:#bcb3ea;
  --dim:#7e75bb;
  --pink:#ff92d2;
  --gold:#ffd57e;
  --sky:#93dcff;
  --display:"Cinzel","Cormorant Garamond",Georgia,serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--night)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60vmax 45vmax at 10% 0%,color-mix(in srgb,var(--pink) 18%,transparent),transparent 70%),
  radial-gradient(55vmax 50vmax at 100% 35%,color-mix(in srgb,var(--sky) 14%,transparent),transparent 70%),
  radial-gradient(70vmax 50vmax at 40% 110%,color-mix(in srgb,#7a5cff 22%,transparent),transparent 70%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(90deg,var(--gold),var(--pink) 55%,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.wallet{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);background:color-mix(in srgb,var(--deep) 80%,transparent);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem}
.wallet svg{width:14px;height:14px}

/* ---------- pochette ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:6px}
.pouch-wrap{position:relative;display:grid;place-items:center;width:100%}
.pouch-wrap::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pink) 30%,transparent),transparent 65%);filter:blur(10px);animation:halo 5s ease-in-out infinite alternate}
@keyframes halo{to{transform:scale(1.12);opacity:.75}}
#pouchSvg{position:relative;width:var(--pw,200px);max-width:72vw;height:auto;overflow:visible;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
#pouchSvg.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{30%{transform:scale(1.07,.95)}60%{transform:scale(.97,1.03)}}
#fillGroup{transition:transform 1s cubic-bezier(.2,1,.3,1)}
.wave{animation:wave 3.2s linear infinite}
.wave2{animation:wave 4.6s linear infinite reverse;opacity:.55}
@keyframes wave{to{transform:translateX(-80px)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.reward{text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0;max-width:100%}
.reward small{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);font-weight:800}
.reward h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.count{font-weight:800;font-variant-numeric:tabular-nums;font-size:1rem;color:var(--text)}
.count b{color:var(--gold);font-size:1.35rem}
.bar{width:min(260px,80%);height:8px;border-radius:99px;background:color-mix(in srgb,var(--deep) 85%,transparent);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--pink),var(--gold));border-radius:99px;transition:width 1s cubic-bezier(.2,1,.3,1);box-shadow:0 0 12px var(--pink)}
.reserve{font-size:.78rem;color:var(--soft)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:14px 2px 4px;margin-inline:-2px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:color-mix(in srgb,var(--deep) 85%,transparent);border-radius:999px;padding:7px 12px 7px 8px;font-weight:700;font-size:.85rem;max-width:220px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .ring{--p:0;width:22px;height:22px;border-radius:50%;flex:none;background:conic-gradient(var(--gold) calc(var(--p)*1turn),color-mix(in srgb,var(--line) 70%,transparent) 0);display:grid;place-items:center}
.chip .ring::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--deep)}
.chip[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--deep));box-shadow:0 0 14px color-mix(in srgb,var(--gold) 35%,transparent)}
.chip.add{color:var(--gold);padding:7px 14px;border-style:dashed}

/* ---------- tâches ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.section-head h3{margin:0;font-family:var(--display);font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.link{border:0;background:none;color:var(--sky);font-weight:700;font-size:.85rem;padding:4px}
.tasks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.task{position:relative;display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;padding:10px 12px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--panel) 92%,transparent),color-mix(in srgb,var(--deep) 92%,transparent));overflow:hidden;transition:transform .12s,border-color .2s}
.task::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--text) 14%,transparent) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.task:active{transform:scale(.96)}
.task:hover{border-color:color-mix(in srgb,var(--pink) 60%,var(--line))}
.task.hit::after{transform:translateX(120%)}
.task .ico{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.task .ico svg{width:22px;height:22px}
.task .lbl{min-width:0;display:flex;flex-direction:column}
.task .lbl b{font-weight:800;font-size:.95rem;overflow-wrap:anywhere;line-height:1.15}
.task .lbl span{font-size:.78rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.editing .task{border-style:dashed}
.editing .task .lbl span::after{content:" · modifier";color:var(--soft);font-weight:700}
.task.new{justify-content:center;color:var(--sky);font-weight:800;border-style:dashed}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.log li{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-size:.9rem}
.log li:last-child{border-bottom:0}
.log time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.78rem;width:42px;flex:none}
.log .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .v{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.empty-line{color:var(--dim);font-size:.88rem;padding:8px 4px}

/* ---------- constellation ---------- */
.sky-box{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:24px;border:1px solid var(--line);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,#5b45d8 30%,var(--deep)),var(--night) 75%);overflow:hidden;margin-top:8px}
.sky-box svg{position:absolute;inset:0;width:100%;height:100%}
.sky-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--soft);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:16px;padding:10px;background:color-mix(in srgb,var(--deep) 85%,transparent);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:1.3rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--soft);font-weight:700}
.done-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.done-list li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--deep) 80%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.done-list .st{flex:none;color:var(--gold)}
.done-list .st svg{width:20px;height:20px}
.done-list .t{flex:1;min-width:0;display:flex;flex-direction:column}
.done-list .t b{overflow-wrap:anywhere}
.done-list .t span{font-size:.76rem;color:var(--soft)}

/* ---------- barre du bas ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;background:linear-gradient(transparent,var(--night) 45%)}
.nav-in{display:flex;gap:4px;padding:5px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--deep) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--soft);font-weight:800;padding:10px 18px;border-radius:999px;font-size:.88rem}
.nav button svg{width:18px;height:18px}
.nav button[aria-selected="true"]{background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 75%,var(--panel)),color-mix(in srgb,#8a6bff 80%,var(--panel)));color:var(--text);box-shadow:0 0 18px color-mix(in srgb,var(--pink) 45%,transparent)}

/* ---------- feuilles ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--night) 70%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;box-sizing:border-box;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,var(--panel),var(--deep));border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .35s cubic-bezier(.2,1,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-family:var(--display);font-size:1.25rem;letter-spacing:.04em}
.sheet p{margin:0;color:var(--soft);font-size:.9rem}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--soft)}
.input{width:100%;box-sizing:border-box;background:var(--night);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text)}
.input::placeholder{color:var(--dim)}
.sizes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.size{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:var(--night);text-align:center}
.size .pv{height:58px;display:flex;align-items:flex-end;justify-content:center}
.size svg{width:auto}
.size b{font-weight:800;font-size:.9rem}
.size span{font-size:.74rem;color:var(--soft)}
.size[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px color-mix(in srgb,var(--gold) 30%,transparent)}
.values{display:flex;gap:8px}
.values button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--night);font-weight:800;color:var(--gold)}
.values button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--night))}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.icons button{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--night);color:var(--pink);display:grid;place-items:center;padding:0}
.icons button svg{width:22px;height:22px}
.icons button[aria-pressed="true"]{border-color:var(--pink);background:color-mix(in srgb,var(--pink) 16%,var(--night))}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--night);border-radius:999px;padding:6px 10px 6px 7px;font-weight:700;font-size:.82rem}
.sg span{display:grid;place-items:center;color:var(--pink)}
.sg span svg{width:16px;height:16px}
.sg b{color:var(--gold);font-size:.75rem}
.sg[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--night))}
.sg[aria-pressed="true"]::after{content:"✓";color:var(--gold);font-weight:800}
.btn{flex:1;min-width:120px;border:1px solid var(--line);background:var(--night);border-radius:999px;padding:12px 18px;font-weight:800}
.btn.main{border:0;color:var(--night);background:linear-gradient(135deg,var(--gold),var(--pink));box-shadow:0 0 22px color-mix(in srgb,var(--pink) 40%,transparent)}
.btn.danger{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 60%,var(--line))}
.btn:disabled{opacity:.45}

.reveal{text-align:center;align-items:center}
.reveal .big{font-family:var(--display);font-size:1.7rem;line-height:1.15;text-wrap:balance;background:linear-gradient(90deg,var(--gold),var(--pink),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.reveal svg{width:110px;height:auto;filter:drop-shadow(0 0 20px color-mix(in srgb,var(--gold) 60%,transparent))}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:65;background:var(--text);color:var(--night);font-weight:800;padding:10px 18px;border-radius:999px;font-size:.88rem;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:#6a3fd9;font-weight:800;padding:0}

@media (prefers-reduced-motion:reduce){
  .wave,.wave2,.twinkle,.pouch-wrap::before,#pouchSvg.bump{animation:none}
  #fillGroup,.bar i{transition:none}
}
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>

<div class="app">
  <div class="top">
    <h1 class="brand">Poussière d'Étoiles</h1>
    <div class="wallet" title="Poussière récoltée au total"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2.6 7.1 7.4.3-5.8 4.6 2 7.2L12 16.6 5.8 20.7l2-7.2L2 8.9l7.4-.3z"/></svg><span id="total">0</span></div>
  </div>

  <section id="view-pouches">
    <div class="stage">
      <div class="pouch-wrap"><svg id="pouchSvg" viewBox="0 0 200 230" role="img" aria-label="Bourse de poussière d'étoiles"></svg></div>
      <div class="reward">
        <small id="sizeName">Bourse</small>
        <h2 id="rewardName">Ma récompense</h2>
        <div class="count"><b id="filled">0</b> / <span id="cap">0</span> éclats</div>
      </div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="reserve" id="reserve" hidden></div>
    </div>

    <div class="chips" id="chips"></div>

    <div class="section-head"><h3>Tâches</h3><button class="link" id="editTasks">Modifier</button></div>
    <div class="tasks" id="tasks"></div>

    <div class="section-head"><h3>Aujourd'hui</h3><span class="reserve" id="todaySum"></span></div>
    <ul class="log" id="log"></ul>
  </section>

  <section id="view-sky" hidden>
    <div class="section-head" style="margin-top:12px"><h3>Ma constellation</h3></div>
    <div class="sky-box" id="skyBox"></div>
    <div class="stats">
      <div class="stat"><b id="stDone">0</b><span>bourses remplies</span></div>
      <div class="stat"><b id="stTasks">0</b><span>tâches faites</span></div>
      <div class="stat"><b id="stDust">0</b><span>éclats récoltés</span></div>
    </div>
    <ul class="done-list" id="doneList"></ul>
  </section>
</div>

<nav class="nav"><div class="nav-in" role="tablist">
  <button id="tab-pouches" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 5c1.5 1.2 6.5 1.2 8 0M9 6.5C6 8.5 4 12 4.5 16c.4 3.3 3.7 5 7.5 5s7.1-1.7 7.5-5c.5-4-1.5-7.5-4.5-9.5M8.5 3.5c1 1 6 1 7 0"/></svg>Bourses</button>
  <button id="tab-sky" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 18l5-9 5 4 4-8"/><circle cx="5" cy="18" r="1.6" fill="currentColor"/><circle cx="10" cy="9" r="1.6" fill="currentColor"/><circle cx="15" cy="13" r="1.6" fill="currentColor"/><circle cx="19" cy="5" r="1.6" fill="currentColor"/></svg>Constellation</button>
</div></nav>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

/* ---------- données ---------- */
const SIZES = [
  { key:"s",  name:"Petite bourse",  cap:10,  hint:"un petit plaisir",   w:150, pw:"38px" },
  { key:"m",  name:"Bourse",         cap:25,  hint:"un plaisir moyen",   w:180, pw:"44px" },
  { key:"l",  name:"Grand sac",      cap:50,  hint:"un gros plaisir",    w:212, pw:"50px" },
  { key:"xl", name:"Coffre céleste", cap:100, hint:"un très grand plaisir", w:240, pw:"56px" }
];
const sizeOf = k => SIZES.find(s => s.key === k) || SIZES[0];

const ICONS = {
  dish:'<path d="M4 13h16a8 8 0 01-16 0zM12 5v3M8 6.5l1 2M16 6.5l-1 2"/>',
  broom:'<path d="M14 3l-4 9M7 12h7l3 8H4z M9 16v4M12 16v4"/>',
  cart:'<path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  shirt:'<path d="M8 4l4 2 4-2 4 4-3 3v9H7v-9L4 8z"/>',
  box:'<path d="M4 8l8-4 8 4v9l-8 4-8-4zM4 8l8 4 8-4M12 12v9"/>',
  pan:'<path d="M3 12h13a0 0 0 010 0 6.5 6.5 0 01-13 0zM16 12h5"/><path d="M8 4c0 2 2 2 2 4M12 4c0 2 2 2 2 4"/>',

function fullReveal(p) {
  if (pendingFull !== p.id) return;
  const m = pouchMouth(); burst(m.x, m.y + 40, 90); buzz([20, 40, 20, 40, 60]);
  openSheet(`<div class="reveal" style="display:flex;flex-direction:column;gap:12px">
    <svg viewBox="0 0 200 230">${pouchSVG(1, { id:"rv", mini:true })}</svg>
    <p style="letter-spacing:.2em;text-transform:uppercase;font-weight:800;font-size:.72rem">${esc(sizeOf(p.size).name)} remplie</p>
    <div class="big">${esc(p.reward)}</div>
    <p>Tu as récolté ${sizeOf(p.size).cap} éclats. Ta récompense t'attend.</p>
    <div class="row-btns" style="width:100%"><button class="btn main" id="claim">Je m'accorde ma récompense</button></div>
    <button class="link" id="later">Plus tard</button>
  </div>`, () => {
    $("claim").onclick = () => claim(p.id);
    $("later").onclick = () => { pendingFull = null; closeSheet(); };
  });
}
function claim(pid) {
  const i = S.pouches.findIndex(x => x.id === pid); if (i < 0) return;
  const p = S.pouches[i];
  S.done.push({ id: p.id, reward: p.reward, size: p.size, doneAt: Date.now() });
  S.pouches.splice(i, 1);
  S.activeId = (S.pouches.find(x => x.filled < sizeOf(x.size).cap) || S.pouches[0] || {}).id || null;
  pendingFull = null; save(); closeSheet(); renderAll();
  burst(innerWidth / 2, innerHeight / 3, 60);
  showToast("Une nouvelle étoile dans ta constellation");
  if (!S.pouches.length) setTimeout(pouchSheet, 900);
}

/* ---------- feuilles ---------- */
function openSheet(html, bind) { const sh = $("sheet"); sh.onclick = null; sh.innerHTML = html; $("sheetWrap").hidden = false; bind && bind(sh); }
function closeSheet() { $("sheetWrap").hidden = true; $("sheet").innerHTML = ""; }
$("sheetWrap").addEventListener("click", e => { if (e.target === $("sheetWrap")) { pendingFull = null; closeSheet(); } });

function pouchSheet(p) {
  const editingP = !!p; let size = p ? p.size : "m";
  openSheet(`<h3>${editingP ? "Modifier la bourse" : "Nouvelle bourse"}</h3>
    <div class="field"><label for="rw">Ta récompense</label><input class="input" id="rw" maxlength="60" placeholder="Ex. un ramen, un jeu, une sortie ciné" value="${esc(p ? p.reward : "")}" autocomplete="off"></div>
    <div class="field"><label>Taille de la bourse</label><div class="sizes">${SIZES.map(s => `<button class="size" data-s="${s.key}" aria-pressed="${s.key === size}"><span class="pv"><svg viewBox="0 0 200 230" style="height:${s.pw}">${pouchSVG(.6, { id:"sz" + s.key, mini:true })}</svg></span><b>${s.name}</b><span>${s.cap} éclats · ${s.hint}</span></button>`).join("")}</div></div>
    <div class="row-btns">${editingP ? `<button class="btn danger" id="delP">Supprimer</button>` : `<button class="btn" id="cancelP">Annuler</button>`}<button class="btn main" id="saveP">${editingP ? "Enregistrer" : "Créer la bourse"}</button></div>`,
  sh => {
    sh.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { size = b.dataset.s; sh.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    $("saveP").onclick = () => {
      const reward = $("rw").value.trim(); if (!reward) { $("rw").focus(); return; }
      if (editingP) { p.reward = reward; p.size = size; p.filled = Math.min(p.filled, sizeOf(size).cap); }
      else {
        const np = { id: uid(), reward, size, filled: 0, created: Date.now() };
        const take = Math.min(S.reserve, sizeOf(size).cap); np.filled = take; S.reserve -= take;
        S.pouches.push(np); S.activeId = np.id;
      }
      save(); closeSheet(); $("pouchSvg").dataset.pid = ""; renderAll();
      if (!editingP) { const m = pouchMouth(); burst(m.x, m.y + 30, 40); }
    };
    if (editingP) {
      const d = $("delP");
      d.onclick = () => {
        if (!d.dataset.armed) { d.dataset.armed = "1"; d.textContent = "Confirmer la suppression"; return; }
        S.pouches = S.pouches.filter(x => x.id !== p.id); S.activeId = S.pouches[0] ? S.pouches[0].id : null;
        save(); closeSheet(); $("pouchSvg").dataset.pid = ""; renderAll();
      };
    } else $("cancelP").onclick = closeSheet;
    if (!editingP) setTimeout(() => $("rw").focus(), 50);
  });
}
function taskSheet(t) {
  const isNew = !t; let val = t ? t.value : 1, ic = t ? t.icon : "spark";
  const has = n => S.tasks.some(x => x.name.toLowerCase() === n.toLowerCase());
  const catalog = isNew ? `<p>Touche une idée pour l'ajouter directement, ou crée la tienne plus bas.</p>
    ${CATALOG.map(c => `<div class="field"><label>${esc(c.cat)}</label><div class="sugg">${c.items.map(([n, i, v]) => `<button class="sg" data-n="${esc(n)}" data-ic="${i}" data-val="${v}" aria-pressed="${has(n)}"><span>${icon(i)}</span>${esc(n)}<b>+${v}</b></button>`).join("")}</div></div>`).join("")}
    <div class="field"><label>Ou ta propre tâche</label></div>` : "";
  openSheet(`<h3>${isNew ? "Nouvelle tâche" : "Modifier la tâche"}</h3>${catalog}
    <div class="field"><label for="tn">Nom</label><input class="input" id="tn" maxlength="30" placeholder="Ex. Sortir le chien" value="${esc(t ? t.name : "")}" autocomplete="off"></div>
    <div class="field"><label>Éclats gagnés</label><div class="values">${[1,2,3,5].map(v => `<button data-v="${v}" aria-pressed="${v === val}">+${v}</button>`).join("")}</div></div>
    <div class="field"><label>Symbole</label><div class="icons">${Object.keys(ICONS).map(k => `<button data-i="${k}" aria-pressed="${k === ic}" aria-label="${k}">${icon(k)}</button>`).join("")}</div></div>
    <div class="row-btns">${isNew ? `<button class="btn" id="cancelT">Annuler</button>` : `<button class="btn danger" id="delT">Supprimer</button>`}<button class="btn main" id="saveT">${isNew ? "Ajouter" : "Enregistrer"}</button></div>`,
  sh => {
    sh.querySelectorAll(".sg").forEach(b => b.onclick = () => {
      const n = b.dataset.n;
      if (has(n)) { S.tasks = S.tasks.filter(x => x.name.toLowerCase() !== n.toLowerCase()); b.setAttribute("aria-pressed", "false"); }
      else { S.tasks.push({ id: uid(), name: n, icon: b.dataset.ic, value: +b.dataset.val }); b.setAttribute("aria-pressed", "true"); buzz(8); }
      save(); renderTasks();
    });
    sh.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { val = +b.dataset.v; sh.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    sh.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { ic = b.dataset.i; sh.querySelectorAll("[data-i]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
    $("saveT").onclick = () => {
      const name = $("tn").value.trim(); if (!name) { $("tn").focus(); return; }
      if (isNew) S.tasks.push({ id: uid(), name, value: val, icon: ic }); else Object.assign(t, { name, value: val, icon: ic });
      save(); closeSheet(); renderTasks();
    };
    if (isNew) $("cancelT").onclick = closeSheet;
    else { const d = $("delT"); d.onclick = () => { if (!d.dataset.armed) { d.dataset.armed = "1"; d.textContent = "Confirmer"; return; } S.tasks = S.tasks.filter(x => x.id !== t.id); save(); closeSheet(); renderTasks(); }; }
  });
}

/* ---------- toast ---------- */
let toastT;
function showToast(msg, undoFn) {
  const el = $("toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undoFn ? `<button id="undoBtn">Annuler</button>` : ""}`;
  el.hidden = false;
  if (undoFn) $("undoBtn").onclick = () => { el.hidden = true; undoFn(); };
  clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, undoFn ? 4500 : 2600);
}

/* ---------- événements ---------- */
$("tasks").addEventListener("click", e => {
  if (e.target.closest("#newTask")) { taskSheet(); return; }
  const b = e.target.closest("[data-t]"); if (!b) return;
  const t = S.tasks.find(x => x.id === b.dataset.t); if (!t) return;
  editing ? taskSheet(t) : doTask(t, b);
});
$("editTasks").onclick = () => { editing = !editing; renderTasks(); };
$("chips").addEventListener("click", e => {
  if (e.target.closest("#addPouch")) { pouchSheet(); return; }
  const c = e.target.closest("[data-p]"); if (!c) return;
  if (c.dataset.p === S.activeId) { pouchSheet(active()); return; }
  S.activeId = c.dataset.p; save(); renderPouch(false); renderChips();
});
$("pouchSvg").addEventListener("click", () => { const p = active(); if (p && p.filled >= sizeOf(p.size).cap) { pendingFull = p.id; fullReveal(p); } else if (p) pouchSheet(p); else pouchSheet(); });
function setTab(tab) {
  $("tab-pouches").setAttribute("aria-selected", String(tab === "pouches"));
  $("tab-sky").setAttribute("aria-selected", String(tab === "sky"));
  $("view-pouches").hidden = tab !== "pouches"; $("view-sky").hidden = tab !== "sky";
  if (tab === "sky") renderSky();
  scrollTo(0, 0);
}
$("tab-pouches").onclick = () => setTab("pouches");
$("tab-sky").onclick = () => setTab("sky");
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheetWrap").hidden) { pendingFull = null; closeSheet(); } });

/* ---------- démarrage ---------- */
sizeSky(); sizeFx(); renderAll(); kick();
const p0 = active(); if (p0 && p0.filled >= sizeOf(p0.size).cap) setTimeout(() => { pendingFull = p0.id; fullReveal(p0); }, 600);
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
